<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>틈틈이 큐브 - 손으로 돌리는 3D 큐브</title>
<meta name="description" content="짬 날 때 한 판, 손으로 돌리는 3D 큐브. 7단계 튜토리얼, 조각 단위 힌트, 매일 모두가 같은 큐브를 푸는 오늘의 챌린지.">
<meta property="og:title" content="틈틈이 큐브">
<meta property="og:description" content="짬 날 때 한 판, 손으로 돌리는 3D 큐브">
<meta property="og:image" content="https://every-cube.ohsangplay.com/apple-touch-icon.png">
<meta name="theme-color" content="#13151b">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#13151b;--panel:#1d2028;--line:#2b2f3a;--text:#eef0f4;--sub:#8e96a6;--acc:#ffb020}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
body{min-height:100vh;background:radial-gradient(110% 60% at 50% 18%,#262b39 0%,var(--bg) 65%)}
main{max-width:460px;margin:0 auto;padding:calc(48px + env(safe-area-inset-top)) 22px calc(36px + env(safe-area-inset-bottom));text-align:center}
.hero{width:168px;height:168px;margin:0 auto 22px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.55));animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(-3deg)}}
h1{font-size:34px;font-weight:900;letter-spacing:-1px}
h1 span{color:var(--acc)}
.tag{color:var(--sub);font-size:15px;margin:8px 0 28px;line-height:1.6}
.stores{display:flex;flex-direction:column;gap:10px}
.store{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:16px;background:#fff;color:#111;text-decoration:none;font-weight:800;font-size:16px;text-align:left;transition:transform .1s}
.store:active{transform:scale(.98)}
.store svg{width:28px;height:28px;flex:none}
.store small{display:block;font-size:11px;font-weight:600;color:#555;margin-bottom:1px}
.store.soon{background:var(--panel);color:var(--sub);border:1px solid var(--line);pointer-events:none}
.store.soon small{color:var(--sub)}
.store.soon svg{opacity:.5}
.store .badge{margin-left:auto;font-size:11px;font-weight:800;background:var(--line);color:var(--text);padding:4px 8px;border-radius:99px}
.features{margin-top:34px;display:flex;flex-direction:column;gap:10px;text-align:left}
.f{display:flex;gap:14px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.f .ic{font-size:22px;width:40px;height:40px;border-radius:12px;background:#262a34;display:flex;align-items:center;justify-content:center;flex:none}
.f b{display:block;font-size:15px;margin-bottom:3px}
.f p{color:var(--sub);font-size:13px;line-height:1.55}
footer{margin-top:34px;font-size:12px;color:#5b6272;line-height:1.9}
footer a{color:#8891a3;text-decoration:none}
</style>
</head>
<body>
<main>
  <svg class="hero" viewBox="0 0 100 100" aria-hidden="true"><g transform="translate(50 52)">
    <path d="M0-40 34.6-20 0 0-34.6-20z" fill="#ffd43b"/><path d="M-34.6-20 0 0 0 40-34.6 20z" fill="#22b357"/><path d="M34.6-20 0 0 0 40 34.6 20z" fill="#ff8c1a"/>
    <g fill="none" stroke="#101114" stroke-width="2.4" stroke-linejoin="round">
      <path d="M0-40 34.6-20 0 0-34.6-20zM-34.6-20 0 0 0 40-34.6 20zM34.6-20 0 0 0 40 34.6 20z"/>
      <path d="M-11.5-33.3 23.1-13.3M11.5-33.3-23.1-13.3M-23.1-26.7 11.5-6.7M23.1-26.7-11.5-6.7"/>
      <path d="M-34.6-6.7 0 13.3 34.6-6.7M-34.6 6.7 0 26.7 34.6 6.7M-23.1-13.3v40M-11.5-6.7v40M11.5-6.7v40M23.1-13.3v40"/>
    </g></g></svg>
  <h1>틈틈이 <span>큐브</span></h1>
  <p class="tag">짬 날 때 한 판, 손으로 돌리는 3D 큐브<br>처음이어도 튜토리얼로 차근차근 맞춰 보세요</p>

  <div class="stores" id="stores">
    <a class="store" id="appStore" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M16.4 12.6c0-2.5 2.1-3.7 2.2-3.8-1.2-1.7-3-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8 1.6 0 2 .8 3.4.8 1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9 0 0-2.7-1-2.7-4.2zM13.9 5.1c.7-.9 1.2-2 1-3.2-1 0-2.3.7-3 1.6-.7.8-1.2 2-1.1 3.1 1.2.1 2.3-.6 3.1-1.5z"/></svg>
      <span><small>iPhone</small>App Store에서 받기</span>
    </a>
    <a class="store" id="playStore" href="https://play.google.com/store/apps/details?id=com.ohsang.play.cube" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path fill="#34a853" d="M3.6 2.3c-.3.3-.4.7-.4 1.2v17c0 .5.1.9.4 1.2l9.4-9.7z"/><path fill="#fbbc04" d="M16.2 15.2 13 12l3.2-3.2 3.8 2.2c1.1.6 1.1 1.6 0 2.2z"/><path fill="#ea4335" d="M13 12 3.6 21.7c.4.4 1 .4 1.7 0l10.9-6.5z"/><path fill="#4285f4" d="M13 12 16.2 8.8 5.3 2.3c-.7-.4-1.3-.4-1.7 0z"/></svg>
      <span><small>Android</small>Google Play에서 받기</span>
    </a>
  </div>

  <section class="features">
    <div class="f"><span class="ic">📖</span><div><b>튜토리얼</b><p>초보자 7단계 공략과 조각 단위 힌트로 처음부터 끝까지 맞춰 봐요.</p></div></div>
    <div class="f"><span class="ic">🧊</span><div><b>일반</b><p>2×2부터 5×5까지. 줄을 고르고 손가락으로 밀어서 돌려요.</p></div></div>
    <div class="f"><span class="ic">🏆</span><div><b>오늘의 챌린지</b><p>매일 모두가 같은 큐브를 풀어요. 하루 한 번, 도움 없이 랭킹에 도전!</p></div></div>
  </section>

  <footer>
    <a href="privacy.html">개인정보처리방침</a> · <a href="terms.html">이용약관</a><br>
    © 2026 오상플레이
  </footer>
</main>
<script>
// 스토어 주소. App Store 앱 ID가 정해지면 APP_STORE에 넣는다 (예: https://apps.apple.com/kr/app/id1234567890)
// 아직 출시 전인 스토어는 SOON을 true로 두면 "출시 예정"으로 보여요.
var APP_STORE = '';
var SOON = { ios: true, android: true };
(function(){
  var ios=document.getElementById('appStore'), play=document.getElementById('playStore');
  function soon(el){ el.classList.add('soon'); el.removeAttribute('href'); el.insertAdjacentHTML('beforeend','<span class="badge">출시 예정</span>'); }
  if(APP_STORE&&!SOON.ios) ios.href=APP_STORE; else soon(ios);
  if(SOON.android) soon(play);
  // 쓰는 폰의 스토어를 위로
  if(/android/i.test(navigator.userAgent)) document.getElementById('stores').prepend(play);
})();
</script>
</body>
</html>
